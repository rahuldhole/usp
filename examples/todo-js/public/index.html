<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USP Todo JS Example</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 40px auto;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .completed {
            text-decoration: line-through;
            color: #888;
        }

        button {
            cursor: pointer;
        }

        .danger {
            color: red;
        }
    </style>
</head>

<body>
    <script type="importmap">
      {
        "imports": {
          "uuid": "https://unpkg.com/uuid@9.0.1/dist/esm-browser/index.js"
        }
      }
    </script>

    <h1>Todo App (USP Realtime Sync)</h1>

    <div>
        <input type="text" id="todo-input" placeholder="What needs to be done?">
        <button id="add-btn">Add Todo</button>
    </div>

    <ul id="todo-list"></ul>

    <div style="margin-top: 20px;">
        <button id="clear-btn">Clear Completed (Server Action)</button>
    </div>

    <hr style="margin: 40px 0;">

    <h2>Visit Counter (Server-Driven)</h2>
    <div style="display: flex; gap: 10px; align-items: center;">
        <button id="dec-btn" style="font-size: 1.5rem; padding: 5px 15px;">-</button>
        <span id="counter-val" style="font-size: 2rem; font-weight: bold;">0</span>
        <button id="inc-btn" style="font-size: 1.5rem; padding: 5px 15px;">+</button>
    </div>

    <hr style="margin: 40px 0;">

    <h2>📢 Global Notice Board (Max Size: 35 bytes)</h2>
    <p style="color: #666; font-size: 0.9rem;">Test USP standardized size restrictions and live error interception by submitting short vs. oversized notices.</p>
    <div style="margin-bottom: 10px;">
        <input type="text" id="notice-input" placeholder="Type notice..." style="width: 280px; padding: 6px;">
        <button id="notice-btn" style="padding: 6px 12px;">Update Notice</button>
    </div>
    <div style="padding: 10px; background: #f4f4f4; border-radius: 4px; margin-top: 10px;">
        <strong>Current Notice: </strong> <span id="notice-val" style="color: #2b7489;">Loading...</span>
    </div>
    <div id="notice-error" style="color: #d9534f; font-size: 0.9rem; margin-top: 8px; font-weight: bold;"></div>

    <!-- We import our frontend app as a module -->
    <script type="module" src="./app.js"></script>
</body>

</html>
