version: '3'

includes:
  usp:
    deps: ["install:deps"]
    taskfile: ./usp/Taskfile.yaml
    dir: ./usp

  todo:
    taskfile: ./examples/todo-js/Taskfile.yaml
    dir: ./examples/todo-js

  multiserver:
    taskfile: ./examples/multiserver-js/Taskfile.yaml
    dir: ./examples/multiserver-js

tasks:
  default:
    cmds: [ "task -l" ]

  install:deps:
    desc: "A.0: Install dependencies (use -f to force install)"
    status:
      - docker compose version
      - test -x $HOME/.cargo/bin/rustc
      - test -x $HOME/.cargo/bin/wasm-pack
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y docker-compose-plugin docker-compose curl
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

  up:
    desc: "A.1: Start infrastructure (Redis)"
    cmds:
      - docker compose -f infra/docker-compose.yaml up -d

  down:
    desc: "A.2: Stop infrastructure"
    cmds:
      - docker compose -f infra/docker-compose.yaml down
